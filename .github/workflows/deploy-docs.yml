name: deploy-docs

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-docs-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.actor != 'nektos/act' }}
    runs-on: ubuntu-latest
    environment: web-deploy
    permissions:
      contents: read
    env:
      DOCS_DEPLOY_HOST: ${{ vars.DOCS_DEPLOY_HOST }}
      DOCS_DEPLOY_USER: ${{ vars.DOCS_DEPLOY_USER }}
      DOCS_DEPLOY_PORT: ${{ vars.DOCS_DEPLOY_PORT || '22' }}
      DOCS_DEPLOY_REPO_DIR: ${{ vars.DOCS_DEPLOY_REPO_DIR || '/collider-app' }}
      DOCS_DEPLOY_WEB_ROOT: ${{ vars.DOCS_DEPLOY_WEB_ROOT || '/var/www/collider' }}
      DOCS_DEPLOY_BRANCH: ${{ vars.DOCS_DEPLOY_BRANCH || 'main' }}
      DOCS_DEPLOY_WEB_GROUP: ${{ vars.DOCS_DEPLOY_WEB_GROUP || 'caddy' }}
      DOCS_DEPLOY_KNOWN_HOSTS: ${{ vars.DOCS_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Read docs version
        id: docs_version
        run: |
          version=$(python - <<'PY'
from pathlib import Path
import tomllib

data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
print(data['project']['version'])
PY
)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate deploy configuration
        run: |
          test -n "$DOCS_DEPLOY_HOST"
          test -n "$DOCS_DEPLOY_USER"
          test -n "$DOCS_DEPLOY_REPO_DIR"
          test -n "$DOCS_DEPLOY_WEB_ROOT"
          test -n "$DOCS_DEPLOY_KNOWN_HOSTS"

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DOCS_DEPLOY_SSH_KEY }}

      - name: Add pinned server host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DOCS_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy docs on server
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            deploy_version="${{ github.event.release.tag_name }}"
            deploy_aliases="latest"
            deploy_ref="${{ github.event.release.tag_name }}"
            checkout_mode="tag"
          else
            deploy_version="${{ steps.docs_version.outputs.version }}"
            deploy_aliases="dev"
            deploy_ref="origin/${DOCS_DEPLOY_BRANCH}"
            checkout_mode="branch"
          fi
          cat .ci/deploy-docs.sh | ssh -p "$DOCS_DEPLOY_PORT" "$DOCS_DEPLOY_USER@$DOCS_DEPLOY_HOST" \
            "sudo -n -u collider env \
             REPO_DIR='$DOCS_DEPLOY_REPO_DIR' \
             DEPLOY_BRANCH='$DOCS_DEPLOY_BRANCH' \
             DOCS_DEPLOY_REF='$deploy_ref' \
             DOCS_DEPLOY_CHECKOUT_MODE='$checkout_mode' \
             DOCS_DEPLOY_VERSION='$deploy_version' \
             DOCS_DEPLOY_ALIASES='$deploy_aliases' \
             WEB_ROOT='$DOCS_DEPLOY_WEB_ROOT' \
             WEB_GROUP='$DOCS_DEPLOY_WEB_GROUP' \
             bash -s"

      - name: Restart collider repo service
        run: |
          set -eu
          ssh -p "$DOCS_DEPLOY_PORT" "$DOCS_DEPLOY_USER@$DOCS_DEPLOY_HOST" \
            "sudo -n systemctl restart collider_repo.service"
