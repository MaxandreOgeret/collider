site_name: Collider
site_description: A package and dependency manager for Meson projects.
site_url: https://maxandreogeret.github.io/collider/
repo_url: https://github.com/MaxandreOgeret/collider
repo_name: MaxandreOgeret/collider

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-white.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - User Guide:
      - Project Setup: guide/project-setup.md
      - Managing Packages: guide/managing-packages.md
      - Repositories: guide/repositories.md
      - Publishing: guide/publishing.md
      - Locking and Installing: guide/locking-and-installing.md
      - Offline Mode: guide/offline-mode.md
      - Serving Repositories: guide/serving.md
  - Reference:
      - CLI: reference/cli.md
      - Configuration Files: reference/configuration.md
      - Wrap API: reference/wrap-api.md
      - Glossary: reference/glossary.md
  - Development:
      - Design: development/design.md

copyright: Copyright &copy; 2026 <a href="https://mogrobotics.com/legal/">MOG Robotics OÜ</a>

hooks:
  - hooks/version.py

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
